<!DOCTYPE html>
<html lang="en" data-theme="spanvision-mono">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Vision PDF Workspace</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <script src="js/theme-init.js"></script>
  <style>html,body{margin:0;padding:0;background:#000000}</style>
  <link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="/brand-palette.css">
    <link rel="stylesheet" href="/appearance.css" />
    <script src="/appearance.js" data-module="pdf" data-slot=".window-controls, .title-bar"></script>
  </head>
<body>
  <div id="app-root"></div>

  <script>
    // Boot diagnostics — installed BEFORE the module graph loads so even
    // import-time errors are recorded as privacy-safe startup phases instead
    // of producing a silent white screen.
    window.addEventListener('error', function (e) {
      try {
        window.__TAURI__ && window.__TAURI__.core && window.__TAURI__.core.invoke(
          'startup_diagnostic', { phase: 'frontend-error', detail: e.message || '?' }
        );
      } catch (_) {}
    });
    window.addEventListener('unhandledrejection', function (e) {
      try {
        var r = e.reason || {};
        window.__TAURI__ && window.__TAURI__.core && window.__TAURI__.core.invoke(
          'startup_diagnostic', { phase: 'frontend-rejection', detail: String(r.message || r) }
        );
      } catch (_) {}
    });
  </script>
  <script src="js/main.js" type="module"></script>
</body>
</html>
