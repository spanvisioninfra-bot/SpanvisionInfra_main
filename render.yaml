services:
  - type: web
    name: spanvision-fem-engine
    runtime: docker
    plan: free
    region: singapore
    branch: version/V.1.0
    dockerfilePath: ./deployment/Dockerfile.fem
    dockerContext: .
    healthCheckPath: /health
    buildFilter:
      paths:
        - deployment/Dockerfile.fem
        - deployment/fem_api.py
        - fem-vision-studio/src-tauri/**
  - type: web
    name: spanvision-bim
    runtime: docker
    plan: free
    region: singapore
    branch: version/V.1.0
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    buildFilter:
      paths:
        - Dockerfile
        - deployment/*.py
        - deployment/browser-identity.mjs
        - deployment/browser-ui.mjs
        - deployment/browser-icons/**
        - deployment/browser-ui/**
        - vision-bim-validator/**
    envVars:
      - key: SPANVISION_SERVICE
        value: bim
  - type: web
    name: spanvision-stl
    runtime: docker
    plan: free
    region: singapore
    branch: version/V.1.0
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/ping
    buildFilter:
      paths:
        - Dockerfile
        - deployment/*.py
        - deployment/browser-identity.mjs
        - deployment/browser-ui.mjs
        - deployment/browser-icons/**
        - deployment/browser-ui/**
        - spanvision-stl-3d-map-workspace/**
    envVars:
      - key: SPANVISION_SERVICE
        value: stl
