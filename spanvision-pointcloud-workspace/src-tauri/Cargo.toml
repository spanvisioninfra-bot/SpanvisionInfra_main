[package]
name = "spanvision-pointcloud-workspace"
version = "0.3.0"
description = "Pointcloud Workspace by Spanvision Infra"
authors = ["Open Pointcloud Studio Contributors", "Spanvision Infra"]
license = "LGPL-3.0-or-later"
repository = ""
edition = "2021"
rust-version = "1.70"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
clap = { version = "4", features = ["derive"] }
tauri-plugin-http = "2"

tauri-plugin-process = "2"
memmap2 = "0.9"
rayon = "1.10"
laz = "0.9"
tempfile = "3.27"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
