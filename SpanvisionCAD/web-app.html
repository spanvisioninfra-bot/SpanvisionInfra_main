<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, follow" />
    <meta name="theme-color" content="#000000" />
    <title>CAD</title>
    <link data-trunk rel="icon" href="assets/logo.svg" />
    <style>
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000000; }
      canvas { display: block; }
      #loading {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        background: #000000;
        color: #eeeeee;
        font-family: system-ui, sans-serif;
        z-index: 9999;
        transition: opacity 0.4s ease;
      }
      #loading.hide { opacity: 0; pointer-events: none; }
      #loading .title { font-size: 22px; font-weight: 600; letter-spacing: 0.5px; }
      #loading .title span { color: #ffffff; }
      #loading .sub { font-size: 12px; color: #999999; }
      #loading .spinner {
        width: 46px;
        height: 46px;
        border: 4px solid #202020;
        border-top-color: #ffffff;
        border-radius: 50%;
        animation: ocs-spin 0.9s linear infinite;
      }
      @keyframes ocs-spin { to { transform: rotate(360deg); } }
    </style>
    <link data-trunk rel="rust" data-bin="SpanvisionCAD" />
    <link data-trunk rel="copy-dir" href="web/fonts" />
    <link data-trunk rel="copy-file" href="web/ocs-parse-worker.js" />
    <link data-trunk rel="copy-file" href="web/discussions.json" />
    <link data-trunk rel="copy-file" href="web/videos.json" />
    <link data-trunk rel="copy-file" href="web/locale-labels.json" />
    <link data-trunk rel="copy-file" href="web/appearance.js" />
    <link data-trunk rel="copy-file" href="web/appearance.css" />
    <link data-trunk rel="copy-file" href="web/workspace-launch.js" />
    <script src="workspace-launch.js"></script>
      <link rel="stylesheet" href="appearance.css" />
    <script src="appearance.js" data-module="cad" data-slot="body"></script>
  </head>
  <body>
    <div id="loading">
      <div class="spinner"></div>
      <div class="title">Spanvision Infra <span>CAD</span></div>
      <div class="sub">Loading…</div>
    </div>
    <script>
      (() => {
        const splash = document.getElementById("loading");
        fetch("locale-labels.json").then(response => response.json()).then(labels => {
          const locale = "en-US";
          document.title = labels[locale].title;
          document.documentElement.lang = locale;
          document.documentElement.dir = locale === "ar-SA" ? "rtl" : "ltr";
          const caption = splash?.querySelector(".sub");
          if (caption) caption.textContent = labels[locale].loading;
        }).catch(() => {});
        let opening;
        const done = () => {
          if (opening) return opening;
          opening = window.SpanvisionCADLaunch().then(() => {
            if (!splash) return;
            splash.classList.add("hide");
            setTimeout(() => splash.remove(), 450);
          }).catch(error => {
            opening = null;
            const caption = splash?.querySelector(".sub");
            if (caption) caption.textContent = error.message;
            if (splash && !splash.querySelector("button")) {
              const retry = document.createElement("button");
              retry.textContent = "Try again";
              retry.onclick = () => { retry.remove(); done(); };
              splash.appendChild(retry);
            }
          });
          return opening;
        };
        if (document.querySelector("canvas")) return done();
        const observer = new MutationObserver(() => {
          if (document.querySelector("canvas")) {
            observer.disconnect();
            done();
          }
        });
        observer.observe(document.body, { childList: true, subtree: true });
      })();
    </script>
  </body>
</html>
